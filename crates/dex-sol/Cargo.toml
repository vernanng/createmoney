[package]
name = "arb-dex-sol"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# reqwest + rustls mirror arb-exec's transport setup (already in Cargo.lock).
# ed25519-dalek (pure-Rust ed25519, no C toolchain) signs; bs58 handles
# Solana's base58 addresses/blockhashes; base64 carries the wire tx to RPC.
ed25519-dalek = "2"
bs58 = "0.5"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", features = ["ring"] }
arb-core.workspace = true
arb-strategy.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
thiserror.workspace = true
anyhow.workspace = true

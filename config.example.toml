# Copy to config.toml and edit. See config.toml for comments on every field.
# NOTE: top-level keys (venues/symbols) must stay above the first [table]
# header — bare keys after a header belong to that table and are ignored.
venues = ["binance", "bybit", "okx", "indodax"]
symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT", "XRP/USDT", "DOGE/USDT"]

[engine]
mode = "paper"
tick_ms = 250
api_addr = "127.0.0.1:8787"
jsonl_path = "paper-trades.jsonl"

[strategies]
cross_exchange = true
triangular = true
funding_rate = true
cex_dex = true

[params]
min_edge_bps = 15
slip_buffer_bps = 5
target_notional_quote = 10
max_book_age_ms = 2000
ttl_ms = 1500
min_funding_annualized_bps = 500
#imbalance_threshold = 0.2  # S6 gate on cross_exchange; off unless set

[indodax]
usd_idr = 19000        # fallback reference for the FX-triangle strategy; book conversion always uses the streamed live rate
rate_max_age_ms = 30000        # live USDT/IDR book older than this stops being the divisor
rate_max_spread_bps = 50       # live USDT/IDR top-of-book spread cap (bps of mid)
rate_max_deviation_bps = 300   # vs independent consensus (Upbit ID + implied crosses); beyond it Indodax is withheld

# Starting capital (simulated seed per venue/asset). Paper fills enforce
# inventory: unfunded buys and sells of unheld assets abort the intent.
# Before going live, set these to your real planned capital per venue so
# the paper soak behaves like the live book. Amounts are not secrets, so
# they live here, not in env (env is API keys only).
[paper]
start_quote_per_venue = 200
# Per-venue quote override; concentrated start lives here:
# [paper.capital]
# binance = 10000
# Base per asset is dynamic: ~5x target notional at the reference price.

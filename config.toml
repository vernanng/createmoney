# arb-engine config. Secrets come from env only — never put keys here.
# NOTE: top-level keys (venues/symbols) must stay above the first [table]
# header — bare keys after a header belong to that table and are ignored.
venues = ["binance", "bybit", "okx", "indodax"]
symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT", "XRP/USDT", "DOGE/USDT"]

[engine]
mode = "paper"        # paper | live (live still requires *_API_KEY env vars)
feed = "live"    # synthetic | live (live WS wiring lands in arb-feed tasks)
tick_ms = 250
api_addr = "127.0.0.1:8787"
jsonl_path = "paper-trades.jsonl"

[strategies]
cross_exchange = true
triangular = true
funding_rate = true
cex_dex = true

[params]
min_edge_bps = 15
slip_buffer_bps = 5
target_notional_quote = 1000
max_book_age_ms = 2000
ttl_ms = 1500
min_funding_annualized_bps = 500

[risk]
max_notional_quote_per_trade = 5000
max_notional_quote_per_venue = 25000

[dex]
uniswap = true
pancakeswap = true
jupiter = true
evm_gas_quote = 1      # USD per swap (L2-ish). Raise for L1.
solana_fee_quote = 1

[indodax]
usd_idr = 19000        # synthetic feed only; live mode streams USDT/IDR and never uses this
rate_max_age_ms = 30000        # live USDT/IDR book older than this stops being the divisor
rate_max_spread_bps = 50       # live USDT/IDR top-of-book spread cap (bps of mid)
rate_max_deviation_bps = 300   # vs independent consensus (Upbit ID + implied crosses); beyond it Indodax is withheld

[paper]
start_quote_per_venue = 1000000  # USDT/USDC seeded per venue (incl. DEX wallets)
start_base_per_asset = 100       # base units seeded per symbol asset

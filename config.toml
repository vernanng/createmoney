# arb-engine config. Secrets come from env only — never put keys here.
# NOTE: top-level keys (venues/symbols) must stay above the first [table]
# header — bare keys after a header belong to that table and are ignored.
venues = ["binance", "bybit", "okx", "indodax"]
symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT", "XRP/USDT", "DOGE/USDT", "BNB/USDT", "ADA/USDT", "LINK/USDT", "TRX/USDT", "LTC/USDT", "DOT/USDT", "AVAX/USDT", "UNI/USDT", "ATOM/USDT", "NEAR/USDT", "XLM/USDT", "ETC/USDT", "ALGO/USDT", "FIL/USDT", "SUI/USDT"]

[engine]
mode = "paper"        # paper | live (live still requires *_API_KEY env vars)
tick_ms = 250
api_addr = "127.0.0.1:8787"
jsonl_path = "paper-trades.jsonl"

[strategies]
cross_exchange = true
triangular = true
funding_rate = true
cex_dex = true

[params]
min_edge_bps = 15
slip_buffer_bps = 5
target_notional_quote = 10
max_book_age_ms = 2000
ttl_ms = 1500
min_funding_annualized_bps = 500
imbalance_threshold = 0.1  # S6 gate on cross_exchange; off unless set

[indodax]
usd_idr = 19000        # fallback reference for the FX-triangle strategy; book conversion always uses the streamed live rate
rate_max_age_ms = 30000        # live USDT/IDR book older than this stops being the divisor
rate_max_spread_bps = 50       # live USDT/IDR top-of-book spread cap (bps of mid)
rate_max_deviation_bps = 300   # vs independent consensus (Upbit ID + implied crosses); beyond it Indodax is withheld

[paper]
start_quote_per_venue = 200  # USDT/USDC seeded per venue (incl. DEX wallets)
# Base per asset is dynamic: ~5x target notional at the reference price, so dynamic S2 sizes fill.

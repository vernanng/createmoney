# arb-engine config. Secrets come from env only — never put keys here.
# NOTE: top-level keys (venues/symbols) must stay above the first [table]
# header — bare keys after a header belong to that table and are ignored.
venues = ["binance", "bybit", "okx", "indodax", "kraken"]
symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT", "XRP/USDT", "DOGE/USDT", "BNB/USDT", "ADA/USDT", "LINK/USDT", "TRX/USDT", "LTC/USDT", "DOT/USDT", "AVAX/USDT", "UNI/USDT", "ATOM/USDT", "NEAR/USDT", "XLM/USDT", "ETC/USDT", "ALGO/USDT", "FIL/USDT", "SUI/USDT"]

[engine]
mode = "paper"        # paper | live (live still requires *_API_KEY env vars)
tick_ms = 250
api_addr = "0.0.0.0:8787"
jsonl_path = "paper-trades.jsonl"

[strategies]
cross_exchange = true
triangular = true
funding_rate = true
cex_dex = true

[params]
min_edge_bps = 15
slip_buffer_bps = 5
target_notional_quote = 500  # base size; S2/S5 grow it while depth stays profitable
max_venue_quote_share_bps = 2500  # one intent may spend <=25% of a venue's USDT+USDC; 0 = off
max_book_age_ms = 2000
ttl_ms = 1500
min_funding_annualized_bps = 500
dex_max_quote_age_ms = 30000  # polled DEX quotes older than this never reach cex_dex
imbalance_threshold = 0.1  # S6 gate on cross_exchange; off unless set

[indodax]
usd_idr = 18000        # fallback reference for the FX-triangle strategy; book conversion always uses the streamed live rate
rate_max_age_ms = 30000        # live USDT/IDR book older than this stops being the divisor
rate_max_spread_bps = 50       # live USDT/IDR top-of-book spread cap (bps of mid)
rate_max_deviation_bps = 300   # vs independent consensus (Upbit ID + implied crosses); beyond it Indodax is withheld

[paper]
start_quote_per_venue = 200  # USDT/USDC seeded per venue (incl. DEX wallets)
transfer_fee_bps = 0    # burned from the sender on each virtual rebalance
transfer_delay_ms = 0   # settlement delay before the receiver can spend it

[paper.capital]
binance = 10000  # concentrated start; missing venues use start_quote_per_venue
# Base is seeded only on Binance (BTC/ETH/SOL, one fill each); everything else starts at zero.

[dex]
jupiter_enabled = true   # public HTTP quotes for SOL/USDT, SOL/USDC; no key needed
jupiter_poll_secs = 10
jupiter_gas_quote = 0.01 # priority fee per swap, in quote terms
evm_rpc_url = ""         # empty = EVM polling off (fail-closed)
evm_pool = ""            # Uniswap V2 ETH/USDT pool address; empty = off
evm_token0_is_base = true # true when token0 is the base asset; wrong inverts every quote
evm_base_decimals = 18
evm_quote_decimals = 6
evm_gas_quote = 0.5
evm_poll_secs = 12

name: publish
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# All publish runs write the same mutable `latest` tag. Keep only the newest
# run active so a slow build of an older commit cannot finish later and move
# `latest` backward.
concurrency:
  group: publish-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # CD gate: only ship what CI already passed on main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    # Native builders per arch: no qemu. Apple Silicon dev machines run the
    # CD paper soak under Watchtower, which can only auto-update a host-arch
    # (arm64) manifest — hence both arches stay.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      # Smoke gate (amd64 leg only): boot the pushed image and prove /health
      # answers before the manifest ships. The config binds loopback, so
      # rewrite to 0.0.0.0 like the CD stack does.
      - if: matrix.arch == 'amd64'
        run: |
          img="${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          docker pull "$img"
          docker run -d --name smoke -p 127.0.0.1:8787:8787 --entrypoint bash "$img" -c 'sed "s|^api_addr *=.*|api_addr = \"0.0.0.0:8787\"|" /etc/arb-engine/config.toml > /tmp/smoke.toml && exec arb-engine --config /tmp/smoke.toml'
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/health && break || sleep 2
          done
          curl -sf http://127.0.0.1:8787/health || { docker logs smoke; exit 1; }
          docker rm -f smoke
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

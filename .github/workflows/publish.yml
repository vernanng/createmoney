name: publish
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# All publish runs write the same mutable `latest` tag. Keep only the newest
# run active so a slow build of an older commit cannot finish later and move
# `latest` backward.
concurrency:
  group: publish-main
  cancel-in-progress: true

jobs:
  image:
    # CD gate: only ship what CI already passed on main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Multi-arch: Apple Silicon dev machines run the CD paper soak under
      # Watchtower, which can only auto-update a host-arch (arm64) manifest.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
      # Smoke gate: boot the image and prove /health answers before pushing.
      # Single-arch load (buildx cannot load multi-arch); the config binds
      # loopback, so rewrite to 0.0.0.0 like the CD stack does.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: createmoney:smoke
          cache-from: type=gha
      - run: |
          docker run -d --name smoke -p 127.0.0.1:8787:8787 --entrypoint bash createmoney:smoke -c 'sed "s|^api_addr *=.*|api_addr = \"0.0.0.0:8787\"|" /etc/arb-engine/config.toml > /tmp/smoke.toml && exec arb-engine --config /tmp/smoke.toml'
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/health && break || sleep 2
          done
          curl -sf http://127.0.0.1:8787/health || { docker logs smoke; exit 1; }
          docker rm -f smoke
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
